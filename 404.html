<!doctype html>
<html>
  <head>
    <script>
      // Save the requested path before redirecting so the app can restore it
      sessionStorage.redirect =
        location.pathname + location.search + location.hash;
      location.replace("/");
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/" /></noscript>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
